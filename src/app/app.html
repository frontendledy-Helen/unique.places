<header class="hero">
  <div class="container">
    <section class="header">
      <div class="logo">
        <img src="images/logo.png" alt="Логотип">
      </div>
    </section>
  </div>
</header>
<main>
  <section class="main">
    <div class="container">
      <div class="main__description">
        <h1 class="main__title">
          Места, которые стоит увидеть хотя бы раз в жизни
        </h1>
        <div class="main__divider">
          <div class="main__divider-line">
            <img src="images/line.png" alt="Линия">
          </div>
          <div class="main__divider-star">
            <img src="images/star.png" alt="Звезда">
          </div>
        </div>
        <p class="main__text">
          Необычные рестораны, отели, развлечения и другие уникальные места со всего мира
        </p>
        <div class="main__print">
          <img src="images/print.png" alt="Печать">
        </div>
      </div>
    </div>
  </section>

  <section class="places">
    <div class="container places__container">
      <div class="places__list">
        @for (place of places; track place.name) {

        <div class="places__item">
          <article class="card">
            <img class="card__image" src="{{ place.imageUrl }}" alt="...">
            <h2 class="card__title">{{ place.name }}</h2>
            <h3 class="card__category">{{ place.category }}</h3>
            <p class="card__text">...</p>
          </article>
        </div>

        }
      </div>
    </div>
  </section>
</main>
